    <text x="176" y="240" text-anchor="middle" font-size="18" font-weight="800" fill="#12805c">환전 수수료</text>
    <text x="176" y="272" text-anchor="middle" font-size="20" font-weight="800" fill="#191c1f">주요 통화 무료</text>
  </g>
  <g>
    <rect x="322" y="140" width="256" height="170" rx="14" fill="#eef5ff" stroke="#d5e6fb"/>
