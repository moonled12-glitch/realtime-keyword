<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="1" y="1" width="898" height="428" rx="22" fill="#ffffff" stroke="#e5e8ea"/>
  <text x="48" y="58" font-size="30" font-weight="800" fill="#191c1f">💡 유류할증료, 어떻게 정해지나</text>
  <line x1="48" y1="82" x2="852" y2="82" stroke="#eef0f2" stroke-width="2"/>

  <!-- 흐름 -->
  <rect x="48" y="106" width="230" height="96" rx="14" fill="#eef5ff" stroke="#d5e6fb"/>
  <text x="163" y="146" text-anchor="middle" font-size="17" font-weight="800" fill="#2563eb">싱가포르 항공유</text>
  <text x="163" y="174" text-anchor="middle" font-size="15" fill="#5b6167">(MOPS) 평균가</text>
  <text x="294" y="160" font-size="26" fill="#b0b6bc">→</text>
  <rect x="322" y="106" width="230" height="96" rx="14" fill="#f2f9f5" stroke="#cdeede"/>
  <text x="437" y="146" text-anchor="middle" font-size="17" font-weight="800" fill="#12805c">단계 결정</text>
  <text x="437" y="174" text-anchor="middle" font-size="15" fill="#5b6167">150센트↑부터 부과</text>
  <text x="568" y="160" font-size="26" fill="#b0b6bc">→</text>
  <rect x="596" y="106" width="256" height="96" rx="14" fill="#fff6ed" stroke="#f6dcc0"/>
  <text x="724" y="146" text-anchor="middle" font-size="17" font-weight="800" fill="#c67c1e">단계별 금액 부과</text>
  <text x="724" y="174" text-anchor="middle" font-size="15" fill="#5b6167">거리 멀수록 ↑ · 매월 갱신</text>

  <!-- 발권 팁 -->
  <line x1="48" y1="230" x2="852" y2="230" stroke="#eef0f2" stroke-width="2"/>
  <text x="48" y="268" font-size="20" font-weight="800" fill="#c0392b">🎫 핵심: '발권일' 기준!</text>
  <g>
    <rect x="48" y="286" width="390" height="118" rx="12" fill="#f2f9f5" stroke="#cdeede"/>
    <text x="72" y="322" font-size="17" font-weight="800" fill="#12805c">📉 다음 달 인하 예상이면</text>
    <text x="72" y="354" font-size="15" fill="#5b6167">발권을 다음 달로 미루면 유리</text>
    <text x="72" y="382" font-size="15" fill="#8a9099">(탑승일 아닌 결제·발권일 기준)</text>
  </g>
  <g>
    <rect x="462" y="286" width="390" height="118" rx="12" fill="#fdecea" stroke="#f6c9c2"/>
    <text x="486" y="322" font-size="17" font-weight="800" fill="#c0392b">📈 다음 달 인상 예상이면</text>
    <text x="486" y="354" font-size="15" fill="#5b6167">이번 달에 미리 발권하면 유리</text>
    <text x="486" y="382" font-size="15" fill="#8a9099">유가·환율·중동 정세 확인</text>
  </g>
</svg>
