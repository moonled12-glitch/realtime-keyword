<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="1" y="1" width="898" height="398" rx="22" fill="#ffffff" stroke="#e5e8ea"/>
  <text x="48" y="60" font-size="32" font-weight="800" fill="#191c1f">🩺 2026 국가건강검진 대상</text>
  <text x="50" y="92" font-size="18" font-weight="700" fill="#0b7d63">올해(짝수 해)는 '짝수년생'이 대상 — 2년에 한 번</text>
  <line x1="48" y1="114" x2="852" y2="114" stroke="#eef0f2" stroke-width="2"/>

  <g>
    <rect x="48" y="138" width="500" height="220" rx="14" fill="#f2f9f5" stroke="#cdeede"/>
    <text x="72" y="176" font-size="20" font-weight="800" fill="#12805c">✅ 일반건강검진 대상</text>
    <text x="72" y="212" font-size="17" fill="#5b6167">· 출생연도 <tspan font-weight="800" fill="#191c1f">끝자리가 짝수(0·2·4·6·8)</tspan>인 사람</text>
    <text x="72" y="244" font-size="16" fill="#8a9099">  (예: 1980·1988·1994·2000·2006년생)</text>
    <text x="72" y="278" font-size="17" fill="#5b6167">· 만 20세 이상 지역가입자·피부양자·세대원</text>
    <text x="72" y="310" font-size="17" fill="#5b6167">· 직장가입자(사무직 2년마다 / 비사무직 매년)</text>
    <text x="72" y="342" font-size="15" fill="#8a9099">※ 홀수년생은 2027년(홀수 해) 대상</text>
  </g>
  <g>
    <rect x="572" y="138" width="280" height="220" rx="14" fill="#eef5ff" stroke="#d5e6fb"/>
    <text x="596" y="176" font-size="19" font-weight="800" fill="#2563eb">🔎 대상 조회</text>
    <text x="596" y="212" font-size="16" fill="#5b6167">국민건강보험공단</text>
    <text x="596" y="238" font-size="16" fill="#5b6167">홈페이지 또는</text>
    <text x="596" y="264" font-size="16" fill="#5b6167">'The건강보험' 앱</text>
    <text x="596" y="298" font-size="16" fill="#5b6167">→ [건강검진 대상 조회]</text>
    <text x="596" y="332" font-size="15" fill="#8a9099">검진표 없이도 조회 가능</text>
  </g>
</svg>
