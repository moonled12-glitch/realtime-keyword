<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="1" y="1" width="898" height="398" rx="22" fill="#ffffff" stroke="#e5e8ea"/>
  <text x="48" y="58" font-size="30" font-weight="800" fill="#191c1f">🗓️ 2026 사실조사 일정 &amp; 과태료</text>
  <line x1="48" y1="82" x2="852" y2="82" stroke="#eef0f2" stroke-width="2"/>

  <g>
    <rect x="48" y="104" width="390" height="120" rx="14" fill="#f2f9f5" stroke="#0b7d63" stroke-width="2"/>
    <text x="72" y="140" font-size="19" font-weight="800" fill="#12805c">✅ 비대면 자기조사 (지금!)</text>
    <text x="72" y="176" font-size="22" font-weight="800" fill="#191c1f">7/20 ~ 9/7</text>
    <text x="72" y="204" font-size="15" fill="#5b6167">정부24 앱으로 직접 응답</text>
  </g>
  <g>
    <rect x="462" y="104" width="390" height="120" rx="14" fill="#fff6ed" stroke="#f6dcc0"/>
    <text x="486" y="140" font-size="19" font-weight="800" fill="#c67c1e">🚪 방문조사</text>
    <text x="486" y="176" font-size="22" font-weight="800" fill="#191c1f">9/8 ~ 11/9</text>
    <text x="486" y="204" font-size="15" fill="#5b6167">비대면 미참여 세대에 조사원 방문</text>
  </g>

  <g>
    <rect x="48" y="240" width="804" height="130" rx="14" fill="#fdecea" stroke="#f0a89e"/>
    <text x="72" y="278" font-size="19" font-weight="800" fill="#c0392b">⚠️ 거부·기피하면 과태료 10만~50만원</text>
    <text x="72" y="312" font-size="15" fill="#5b6167">정당한 사유 없이 조사를 거부·고의로 피하면 부과될 수 있습니다.</text>
    <text x="72" y="340" font-size="15" fill="#5b6167">직장·학업·해외 체류 등 정당한 사유가 있으면 대상이 아닙니다.</text>
  </g>
