    <text x="72" y="453" font-size="20" font-weight="800" fill="#c0392b">성탄절(크리스마스)</text>
    <text x="828" y="453" text-anchor="end" font-size="18" font-weight="700" fill="#191c1f">12/25(금)~12/27(일) → 3일 연휴</text>
