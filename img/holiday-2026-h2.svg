<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="1" y="1" width="898" height="498" rx="22" fill="#ffffff" stroke="#e5e8ea"/>
  <text x="48" y="60" font-size="34" font-weight="800" fill="#191c1f">🗓️ 2026년 하반기 공휴일</text>
  <text x="50" y="92" font-size="18" font-weight="700" fill="#0b7d63">8월 이후 남은 빨간날·연휴 한눈에</text>
  <line x1="48" y1="114" x2="852" y2="114" stroke="#eef0f2" stroke-width="2"/>

  <g>
    <rect x="48" y="136" width="804" height="60" rx="12" fill="#fdecea" stroke="#f6c9c2"/>
    <text x="72" y="173" font-size="20" font-weight="800" fill="#c0392b">광복절 · 대체공휴일</text>
    <text x="828" y="173" text-anchor="end" font-size="18" font-weight="700" fill="#191c1f">8/15(토) + 8/17(월) → 3일 연휴</text>
  </g>
  <g>
    <rect x="48" y="206" width="804" height="60" rx="12" fill="#fff6ed" stroke="#f6dcc0"/>
