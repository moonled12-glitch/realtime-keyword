    <text x="828" y="243" text-anchor="end" font-size="18" font-weight="700" fill="#191c1f">9/24(목)~9/27(일) → 4일 연휴</text>
  </g>
  <g>
    <rect x="48" y="276" width="804" height="60" rx="12" fill="#fdecea" stroke="#f6c9c2"/>
    <text x="72" y="313" font-size="20" font-weight="800" fill="#c0392b">개천절 · 대체공휴일</text>
    <text x="828" y="313" text-anchor="end" font-size="18" font-weight="700" fill="#191c1f">10/3(토) + 10/5(월) → 3일 연휴</text>
  </g>
  <g>
    <rect x="48" y="346" width="804" height="60" rx="12" fill="#fdecea" stroke="#f6c9c2"/>
