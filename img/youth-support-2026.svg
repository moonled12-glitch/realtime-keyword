<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="1" y="1" width="898" height="498" rx="22" fill="#ffffff" stroke="#e5e8ea"/>
  <text x="48" y="60" font-size="34" font-weight="800" fill="#191c1f">🧑‍🎓 2026 청년 지원, 4가지 핵심</text>
  <text x="50" y="92" font-size="18" font-weight="700" fill="#0b7d63">주거·목돈·취업·자산 형성을 나눠서 챙기기</text>
  <line x1="48" y1="114" x2="852" y2="114" stroke="#eef0f2" stroke-width="2"/>

  <g>
    <rect x="48" y="138" width="390" height="150" rx="14" fill="#f2f9f5" stroke="#cdeede"/>
    <text x="72" y="180" font-size="21" font-weight="800" fill="#12805c">🏠 청년월세 특별지원</text>
    <text x="72" y="214" font-size="16" fill="#5b6167">월 최대 20만원 × 최장 24개월</text>
    <text x="72" y="242" font-size="16" fill="#5b6167">무주택 청년(소득요건 충족)</text>
    <text x="72" y="270" font-size="15" fill="#8a9099">2026년 상시사업으로 전환</text>
  </g>
  <g>
    <rect x="462" y="138" width="390" height="150" rx="14" fill="#eef5ff" stroke="#d5e6fb"/>
    <text x="486" y="180" font-size="21" font-weight="800" fill="#2563eb">💰 청년미래적금</text>
    <text x="486" y="214" font-size="16" fill="#5b6167">2026년 신설(청년도약계좌 후속)</text>
    <text x="486" y="242" font-size="16" fill="#5b6167">정부기여금 + 우대금리 + 비과세</text>
    <text x="486" y="270" font-size="15" fill="#8a9099">3년간 목돈 마련 지원</text>
  </g>
  <g>
    <rect x="48" y="304" width="390" height="150" rx="14" fill="#fff6ed" stroke="#f6dcc0"/>
    <text x="72" y="346" font-size="21" font-weight="800" fill="#c67c1e">🧭 국민취업지원제도</text>
    <text x="72" y="380" font-size="16" fill="#5b6167">구직촉진수당 + 취업 서비스</text>
    <text x="72" y="408" font-size="16" fill="#5b6167">저소득 구직 청년 등 대상</text>
    <text x="72" y="436" font-size="15" fill="#8a9099">고용센터·고용24 신청</text>
  </g>
  <g>
    <rect x="462" y="304" width="390" height="150" rx="14" fill="#f7f5ff" stroke="#e6ddff"/>
    <text x="486" y="346" font-size="21" font-weight="800" fill="#6b46c1">📋 그 외 챙길 것</text>
    <text x="486" y="380" font-size="16" fill="#5b6167">청년내일채움공제·일자리도약장려금</text>
    <text x="486" y="408" font-size="16" fill="#5b6167">지자체별 청년수당·교통비 지원</text>
    <text x="486" y="436" font-size="15" fill="#8a9099">복지로·청년센터에서 조회</text>
  </g>
</svg>
