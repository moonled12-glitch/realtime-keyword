  <line x1="48" y1="114" x2="852" y2="114" stroke="#eef0f2" stroke-width="2"/>

  <!-- 타임라인 축 -->
  <line x1="90" y1="270" x2="812" y2="270" stroke="#d7dde3" stroke-width="4"/>

  <!-- 노드 1 -->
  <circle cx="150" cy="270" r="12" fill="#0b7d63"/>
  <text x="150" y="205" text-anchor="middle" font-size="17" font-weight="800" fill="#191c1f">9월 2일</text>
  <text x="150" y="230" text-anchor="middle" font-size="15" fill="#5b6167">9월 모의평가</text>
  <text x="150" y="318" text-anchor="middle" font-size="14" fill="#8a9099">최종 실력 점검</text>

  <!-- 노드 2 -->
  <circle cx="370" cy="270" r="12" fill="#2563eb"/>
  <text x="370" y="205" text-anchor="middle" font-size="17" font-weight="800" fill="#191c1f">9월 중순</text>
  <text x="370" y="230" text-anchor="middle" font-size="15" fill="#5b6167">수시 원서접수</text>
  <text x="370" y="318" text-anchor="middle" font-size="14" fill="#8a9099">대학별 일정 확인</text>

  <!-- 노드 3 (수능) -->
  <circle cx="590" cy="270" r="16" fill="#c0392b"/>
  <text x="590" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#c0392b">11월 19일(목)</text>
