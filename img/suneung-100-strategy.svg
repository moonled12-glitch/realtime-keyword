  </g>
  <g>
    <rect x="462" y="138" width="390" height="150" rx="14" fill="#eef5ff" stroke="#d5e6fb"/>
    <text x="486" y="180" font-size="21" font-weight="800" fill="#2563eb">🔢 수학·탐구</text>
    <text x="486" y="214" font-size="16" fill="#5b6167">틀린 문제 다시 풀기(개념 구멍 메우기)</text>
    <text x="486" y="242" font-size="16" fill="#5b6167">킬러 대신 준킬러·3점 실수 줄이기</text>
