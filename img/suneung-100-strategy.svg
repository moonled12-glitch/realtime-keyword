<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="1" y="1" width="898" height="498" rx="22" fill="#ffffff" stroke="#e5e8ea"/>
  <text x="48" y="60" font-size="34" font-weight="800" fill="#191c1f">🎯 수능 100일, 무엇에 집중할까</text>
  <text x="50" y="92" font-size="18" font-weight="700" fill="#0b7d63">새 개념보다 '아는 걸 실수 없이' 만드는 시기</text>
  <line x1="48" y1="114" x2="852" y2="114" stroke="#eef0f2" stroke-width="2"/>

  <g>
    <rect x="48" y="138" width="390" height="150" rx="14" fill="#f2f9f5" stroke="#cdeede"/>
    <text x="72" y="180" font-size="21" font-weight="800" fill="#12805c">📖 국어·영어</text>
    <text x="72" y="214" font-size="16" fill="#5b6167">매일 지문 감각 유지 · 오답 유형 정리</text>
    <text x="72" y="242" font-size="16" fill="#5b6167">시간 배분 연습(실전 시험지 그대로)</text>
