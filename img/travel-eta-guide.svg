<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="1" y="1" width="898" height="418" rx="22" fill="#ffffff" stroke="#e5e8ea"/>
  <text x="48" y="58" font-size="30" font-weight="800" fill="#191c1f">🛂 나라별 전자여행허가 (2026)</text>
  <line x1="48" y1="82" x2="852" y2="82" stroke="#eef0f2" stroke-width="2"/>

  <g>
    <rect x="48" y="104" width="390" height="120" rx="14" fill="#f2f9f5" stroke="#cdeede"/>
    <text x="72" y="142" font-size="20" font-weight="800" fill="#12805c">🇺🇸 미국 ESTA</text>
    <text x="72" y="176" font-size="16" fill="#5b6167">시행 중 · 출발 전 온라인 신청</text>
    <text x="72" y="202" font-size="15" fill="#8a9099">유효기간 2년(그 안에 재사용 가능)</text>
  </g>
  <g>
    <rect x="462" y="104" width="390" height="120" rx="14" fill="#eef5ff" stroke="#d5e6fb"/>
    <text x="486" y="142" font-size="20" font-weight="800" fill="#2563eb">🇬🇧 영국 ETA</text>
    <text x="486" y="176" font-size="16" fill="#5b6167">시행 중 · 방문 전 사전 허가 필요</text>
    <text x="486" y="202" font-size="15" fill="#8a9099">앱·웹으로 신청</text>
  </g>
  <g>
    <rect x="48" y="238" width="390" height="120" rx="14" fill="#fff6ed" stroke="#f6a94c" stroke-width="2"/>
    <text x="72" y="276" font-size="20" font-weight="800" fill="#c67c1e">🇪🇺 유럽 ETIAS</text>
    <text x="72" y="310" font-size="16" fill="#5b6167">2026년 하반기(4분기) 도입 예정</text>
    <text x="72" y="336" font-size="15" fill="#c0392b" font-weight="700">아직 시행 전 → 발급 사이트 사기 주의</text>
  </g>
  <g>
    <rect x="462" y="238" width="390" height="120" rx="14" fill="#f7f5ff" stroke="#e6ddff"/>
    <text x="486" y="276" font-size="20" font-weight="800" fill="#6b46c1">🇯🇵 일본 등</text>
    <text x="486" y="310" font-size="16" fill="#5b6167">일본: Visit Japan Web로 입국 간소화</text>
    <text x="486" y="336" font-size="15" fill="#8a9099">방문국별 요건은 출발 전 꼭 확인</text>
  </g>

  <text x="48" y="392" font-size="14" fill="#8a9099">※ 전자여행허가는 '비자'가 아니며, 방문국·목적·체류기간에 따라 요건이 달라집니다.</text>
</svg>
