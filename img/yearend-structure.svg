<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="1" y="1" width="898" height="438" rx="22" fill="#ffffff" stroke="#e5e8ea"/>
  <text x="48" y="58" font-size="32" font-weight="800" fill="#191c1f">🧮 연말정산, 두 가지 공제 이해하기</text>
  <line x1="48" y1="82" x2="852" y2="82" stroke="#eef0f2" stroke-width="2"/>

  <g>
    <rect x="48" y="104" width="390" height="150" rx="14" fill="#eef5ff" stroke="#d5e6fb"/>
    <text x="72" y="142" font-size="21" font-weight="800" fill="#2563eb">① 소득공제</text>
    <text x="72" y="178" font-size="16" fill="#5b6167">세금을 매기는 '기준 소득'을 줄임</text>
    <text x="72" y="206" font-size="15" fill="#8a9099">예: 인적공제, 신용카드,</text>
    <text x="72" y="230" font-size="15" fill="#8a9099">주택청약, 국민연금 등</text>
  </g>
  <g>
    <rect x="462" y="104" width="390" height="150" rx="14" fill="#f2f9f5" stroke="#cdeede"/>
    <text x="486" y="142" font-size="21" font-weight="800" fill="#12805c">② 세액공제</text>
    <text x="486" y="178" font-size="16" fill="#5b6167">계산된 '세금'에서 직접 빼줌</text>
    <text x="486" y="206" font-size="15" fill="#8a9099">예: 연금계좌, 의료비, 교육비,</text>
    <text x="486" y="230" font-size="15" fill="#8a9099">월세, 기부금, 보장성보험</text>
  </g>

  <!-- 타임라인 -->
  <text x="48" y="300" font-size="19" font-weight="800" fill="#0b7d63">📅 일정 (다음 해 초)</text>
  <line x1="90" y1="360" x2="810" y2="360" stroke="#d7dde3" stroke-width="4"/>
  <circle cx="170" cy="360" r="11" fill="#0b7d63"/>
  <text x="170" y="338" text-anchor="middle" font-size="15" font-weight="800" fill="#191c1f">1/15~</text>
  <text x="170" y="392" text-anchor="middle" font-size="14" fill="#8a9099">간소화 서비스 개통</text>
  <circle cx="450" cy="360" r="11" fill="#2563eb"/>
  <text x="450" y="338" text-anchor="middle" font-size="15" font-weight="800" fill="#191c1f">1~2월</text>
  <text x="450" y="392" text-anchor="middle" font-size="14" fill="#8a9099">자료 제출·회사 정산</text>
  <circle cx="730" cy="360" r="11" fill="#6b46c1"/>
  <text x="730" y="338" text-anchor="middle" font-size="15" font-weight="800" fill="#191c1f">2~3월</text>
  <text x="730" y="392" text-anchor="middle" font-size="14" fill="#8a9099">환급·추가납부 반영</text>
</svg>
