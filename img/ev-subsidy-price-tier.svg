<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="1" y="1" width="898" height="398" rx="22" fill="#ffffff" stroke="#e5e8ea"/>
  <text x="48" y="58" font-size="32" font-weight="800" fill="#191c1f">🔌 차값에 따라 달라지는 국고보조금</text>
  <text x="50" y="90" font-size="17" font-weight="700" fill="#0b7d63">기준가는 '옵션 제외 기본가' (2026년 승용 기준)</text>
  <line x1="48" y1="112" x2="852" y2="112" stroke="#eef0f2" stroke-width="2"/>

  <g>
    <rect x="48" y="140" width="256" height="200" rx="14" fill="#f2f9f5" stroke="#cdeede"/>
    <text x="176" y="182" text-anchor="middle" font-size="19" font-weight="800" fill="#12805c">5,300만원 미만</text>
    <text x="176" y="230" text-anchor="middle" font-size="40" font-weight="800" fill="#191c1f">100%</text>
    <text x="176" y="270" text-anchor="middle" font-size="16" fill="#5b6167">국고보조금 전액</text>
    <text x="176" y="300" text-anchor="middle" font-size="15" fill="#8a9099">중·대형 최대 580만원</text>
  </g>
  <g>
    <rect x="322" y="140" width="256" height="200" rx="14" fill="#fff6ed" stroke="#f6dcc0"/>
    <text x="450" y="182" text-anchor="middle" font-size="18" font-weight="800" fill="#c67c1e">5,300~8,500만원</text>
    <text x="450" y="230" text-anchor="middle" font-size="40" font-weight="800" fill="#191c1f">50%</text>
    <text x="450" y="270" text-anchor="middle" font-size="16" fill="#5b6167">국고보조금 절반</text>
    <text x="450" y="300" text-anchor="middle" font-size="15" fill="#8a9099">최대 약 290만원</text>
  </g>
  <g>
    <rect x="596" y="140" width="256" height="200" rx="14" fill="#fdecea" stroke="#f6c9c2"/>
    <text x="724" y="182" text-anchor="middle" font-size="19" font-weight="800" fill="#c0392b">8,500만원 이상</text>
    <text x="724" y="230" text-anchor="middle" font-size="40" font-weight="800" fill="#191c1f">0원</text>
    <text x="724" y="270" text-anchor="middle" font-size="16" fill="#5b6167">국고보조금 제외</text>
    <text x="724" y="300" text-anchor="middle" font-size="15" fill="#8a9099">고가 차량 대상 아님</text>
