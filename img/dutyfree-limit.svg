  <line x1="48" y1="112" x2="852" y2="112" stroke="#eef0f2" stroke-width="2"/>

  <g>
    <rect x="48" y="140" width="804" height="72" rx="14" fill="#f2f9f5" stroke="#0b7d63" stroke-width="2"/>
