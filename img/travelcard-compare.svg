<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="1" y="1" width="898" height="398" rx="22" fill="#ffffff" stroke="#e5e8ea"/>
  <text x="48" y="58" font-size="30" font-weight="800" fill="#191c1f">🔍 주요 트래블카드 특징</text>
  <line x1="48" y1="82" x2="852" y2="82" stroke="#eef0f2" stroke-width="2"/>

  <g>
    <rect x="48" y="104" width="390" height="130" rx="14" fill="#eef5ff" stroke="#d5e6fb"/>
    <text x="72" y="140" font-size="20" font-weight="800" fill="#2563eb">트래블월렛</text>
    <text x="72" y="172" font-size="15" fill="#5b6167">아무 은행 계좌나 연결 가능</text>
    <text x="72" y="200" font-size="15" fill="#5b6167">여러 통화 미리 충전 · 가족 여행에 편리</text>
  </g>
  <g>
    <rect x="462" y="104" width="390" height="130" rx="14" fill="#f2f9f5" stroke="#cdeede"/>
    <text x="486" y="140" font-size="20" font-weight="800" fill="#12805c">트래블로그 (하나)</text>
    <text x="486" y="172" font-size="15" fill="#5b6167">하나머니 앱으로 실시간 환전·충전</text>
    <text x="486" y="200" font-size="15" fill="#5b6167">다양한 통화 우대 · 장기 여행 혜택</text>
  </g>
  <g>
    <rect x="48" y="248" width="390" height="130" rx="14" fill="#fff6ed" stroke="#f6dcc0"/>
    <text x="72" y="284" font-size="20" font-weight="800" fill="#c67c1e">SOL트래블 (신한)</text>
    <text x="72" y="316" font-size="15" fill="#5b6167">공항 라운지 등 부가 혜택</text>
    <text x="72" y="344" font-size="15" fill="#5b6167">신한 계좌 이용자에게 편리</text>
  </g>
  <g>
    <rect x="462" y="248" width="390" height="130" rx="14" fill="#f7f5ff" stroke="#e6ddff"/>
    <text x="486" y="284" font-size="20" font-weight="800" fill="#6b46c1">토스 외화</text>
    <text x="486" y="316" font-size="15" fill="#5b6167">간편한 송금·충전, 직관적인 앱</text>
    <text x="486" y="344" font-size="15" fill="#5b6167">평소 토스 쓰는 사람에게 편리</text>
  </g>
</svg>
