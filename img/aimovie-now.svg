    <text x="486" y="232" font-size="15" fill="#5b6167">배우·업계 반발 — 논란 지속</text>
  </g>
  <g>
    <rect x="48" y="272" width="390" height="120" rx="14" fill="#f2f9f5" stroke="#cdeede"/>
