  </g>
  <g>
    <rect x="462" y="272" width="390" height="120" rx="14" fill="#f7f5ff" stroke="#e6ddff"/>
    <text x="486" y="308" font-size="19" font-weight="800" fill="#6b46c1">💸 소라 앱 종료</text>
    <text x="486" y="340" font-size="15" fill="#5b6167">OpenAI, 2026년 3월 소라 앱 중단</text>
    <text x="486" y="366" font-size="15" fill="#5b6167">저작권 소송·높은 운영비 부담</text>
